apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: nginx

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.30
          ports:
            - containerPort: 80
