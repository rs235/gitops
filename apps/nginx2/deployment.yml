apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx2

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: nginx2

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx2

    spec:
      containers:
        - name: nginx
          image: nginx:1.31
          ports:
            - containerPort: 80
