      #       rendered/**/*.yml

  kube-linter:
    name: KubeLinter
    runs-on: ubuntu-latest

    needs:
      # - helm-render
      - kustomize-render

    steps:
      # - name: Download Helm manifests
      #   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      #   with:
      #     name: helm-rendered
      #     path: rendered/helm

      - name: Download Kustomize manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kustomize-rendered
          path: rendered/kustomize

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5
        with:
          directory: rendered
          # config: .kube-linter.yml

  kubeconform-argocd:
    name: Argo CD Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Debug schemas
        run: |
          find schemas -type f -maxdepth 2 -print

      - name: Validate manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -ignore-filename-pattern kustomization\.ya?ml
            -ignore-filename-pattern values\.ya?ml
            -schema-location default
            -schema-location '/github/workspace/schemas/{{.ResourceKind}}.json'
            applications/
            bootstrap/
            clusters/
            projects/

