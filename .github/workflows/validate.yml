  kubeconform-k8s:
    name: Kubernetes Schema Validation
    runs-on: ubuntu-latest

    needs:
      - kustomize-render
      # - helm-render

    steps:

      # - name: Download Helm manifests
      #   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      #   with:
      #     name: helm-rendered
      #     path: rendered/helm

      - name: Download Kustomize manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kustomize-rendered
          path: rendered/kustomize

      - name: Debug rendered manifests
        run: |
          pwd
          find rendered -type f -print

      - name: Validate manifests
        # Uses official kubeconform Docker container with pinned tag.
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            rendered/kustomize

      # - name: Validate all manifests
