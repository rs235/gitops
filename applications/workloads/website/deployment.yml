---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: website
  namespace: website

spec:
  replicas: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: website

  template:
    metadata:
      labels:
        app.kubernetes.io/name: website

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: nginx:1.31

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
