apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd

spec:
  project: argocd

  source:
    repoURL: https://github.com/argoproj/argo-cd.git
    targetRevision: v3.5.2
    path: manifests/cluster-install

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
